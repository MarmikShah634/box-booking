services:
  postgres:
    image: postgres:16-alpine
    container_name: boxcricket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boxcricket
      POSTGRES_PASSWORD: boxcricket_dev
      POSTGRES_DB: boxcricket
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boxcricket']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boxcricket-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_dev_pass
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_dev_pass', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
